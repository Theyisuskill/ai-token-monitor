# AI Token Monitor — copy to ~/.config/ai-token-monitor/config.yaml
# Every key is optional; anything omitted falls back to the built-in default.

# Where the SQLite history lives (XDG data dir by default).
database: ~/.local/share/ai-token-monitor/usage.db

log_level: info          # debug | info | warning | error
signal_debounce_ms: 750  # coalesce bursts before emitting UsageUpdated
rescan_interval_s: 300   # periodic full rescan (0 disables)

adapters:
  claude_code:
    enabled: true
    root: ~/.claude/projects
  gemini_cli:
    enabled: true
    root: ~/.gemini/tmp
    # Model applied to Antigravity usage recorded before a model switch is
    # seen in the conversation (rarely needed):
    # default_model: gemini-3.5-flash
  codex:
    enabled: true
    root: ~/.codex/sessions
  opencode:
    enabled: true
    # OpenCode keeps one SQLite db; leave `root` unset for the default
    # ~/.local/share/opencode (honours $XDG_DATA_HOME). OpenCode prices each
    # turn itself, so its real spend is shown even for models not in `pricing`.
    # root: ~/.local/share/opencode
  # Third-party adapters (installed via pip entry points) are configured the
  # same way, keyed by their `name`.

# Subscription tier per tool. The daemon turns this into the USD ceilings that
# scale the "Five Hour" / "Weekly" limit bars, so the UI fits YOUR plan rather
# than a fixed one. Neither Claude nor Antigravity publishes a dollar figure for
# its rolling limits, so these are API-equivalent approximations you can tune.
# Unset tools fall back to the lowest tier.
plans:
  claude_code: pro       # pro | max_5x | max_20x   (Max = 5x / 20x the Pro cap)
  gemini_cli: free       # Antigravity ("agy"): free | pro | ultra
  codex: plus            # OpenAI Codex CLI: plus | pro

# preset = use the tiers above.
# auto   = ignore the tiers and calibrate each bar to your own busiest observed
#          5h / 7d window (self-adjusting; needs no plan knowledge).
budget_mode: preset

# Live limit pollers — read the provider's OWN 5h/weekly percentage and reset
# instead of the dollar estimate above. This makes an outbound request (an
# opt-in relaxation of the local-only default), so it's enabled per tool.
# The Claude poller reads ~/.claude/.credentials.json (the OAuth token Claude
# Code already stores; needs the `user:profile` scope) and calls the Anthropic
# usage API. It is READ-ONLY — it never rewrites that file. When live data is
# present the popup shows a real bar (teal "live" dot) with the exact reset,
# and the plan/budget scaling above is only used as the fallback.
live_limits:
  claude_code:
    enabled: true      # set false to stay fully local (estimate-only)
    interval_s: 90
    # credentials: ~/.claude/.credentials.json
    # timeout_s: 15
  # Antigravity ("agy", shown under the gemini_cli tool): tries the running
  # Antigravity language server on 127.0.0.1 first (real two-pool quota), then
  # falls back to ~/.gemini/oauth_creds.json. Off by default because it probes
  # local server ports and only yields data while Antigravity is running.
  antigravity:
    enabled: false
    interval_s: 120
    # ports: [40495, 42155]   # override /proc port discovery if needed
  # OpenAI Codex CLI (~/.codex/auth.json). Off by default; enable if you use it.
  codex:
    enabled: false
    interval_s: 120

# Optional. daily/weekly/monthly are informational only. Any per-tool key here
# (claude_5h, claude_weekly, gemini_5h, gemini_weekly) OVERRIDES the plan preset
# for that one bar — set it if you know your exact ceiling.
budgets:
  daily: 0.0
  weekly: 0.0
  monthly: 0.0
  # claude_weekly: 1500
  # OpenCode Go meters a monthly limit; set a $ ceiling to turn its Monthly
  # bar into a percentage (otherwise it shows the calendar-month spend):
  # opencode_monthly: 20

# USD per 1 million tokens. Rules are evaluated top to bottom with fnmatch;
# the first match wins. VERIFY these against your providers' current pricing.
pricing:
  - match: "claude-fable-*"
    input: 10.0
    output: 50.0
    cache_read: 1.0
    cache_write: 12.5
  - match: "claude-opus-4-[01]*"   # legacy Opus 4.0 / 4.1
    input: 15.0
    output: 75.0
    cache_read: 1.5
    cache_write: 18.75
  - match: "claude-opus-*"
    input: 5.0
    output: 25.0
    cache_read: 0.5
    cache_write: 6.25
  - match: "claude-sonnet-*"
    input: 3.0
    output: 15.0
    cache_read: 0.3
    cache_write: 3.75
  - match: "claude-haiku-*"
    input: 1.0
    output: 5.0
    cache_read: 0.1
    cache_write: 1.25
  - match: "gemini-*pro*"
    input: 1.25
    output: 10.0
    cache_read: 0.31
    cache_write: 0.0
  - match: "gemini-*"
    input: 0.30
    output: 2.50
    cache_read: 0.075
    cache_write: 0.0
  - match: "gpt-*"
    input: 1.25
    output: 10.0
    cache_read: 0.125
    cache_write: 0.0
  - match: "*"          # unknown models count tokens but cost $0
    input: 0.0
    output: 0.0
    cache_read: 0.0
    cache_write: 0.0
